# FixGuard API reverse proxy.
# The critical bit is the SSE location block: without proxy_buffering off the
# audit progress stream is held in NGINX's buffer and the UI appears frozen.

server {
    listen 80;
    server_name _;

    client_max_body_size 1m;

    # Progress stream: no buffering, long read timeout, no gzip.
    location ~ ^/api/v1/audits/[^/]+/stream$ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        return 404;
    }
}

