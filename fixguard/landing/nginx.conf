# Serves the static marketing site at fixguardai.online.
#
# Same security headers as the dashboard (fixguard/dashboard/nginx.conf), and
# for the same reason they are repeated in every location that sets its own
# headers: nginx does not merge add_header down into a location that has any.
#
# Pages are plain HTML with no inline script, so script-src is 'self' only.
# Styles allow 'unsafe-inline' because the pages set animation timing through
# style attributes (--i, --score); CSP cannot allow attributes without it.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The site used to answer on www as well. One canonical host.
    if ($host = www.fixguardai.online) {
        return 301 https://fixguardai.online$request_uri;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 512;

    set $site_csp "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'";

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy $site_csp always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Asset URLs carry a content hash in the query string, so a year is safe.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy $site_csp always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # /pricing and /pricing/ both serve pricing/index.html; anything else is
    # a real 404 with a real 404 page, not a 200 that renders "not found".
    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy $site_csp always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
