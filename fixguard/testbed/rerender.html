  <h1>Today's menu</h1>
  <p>This page reproduces the runaway re-render an unguarded
     <code>useEffect</code> produces: state is written on every render, so the
     component never settles. No console error is thrown, which is exactly why
     it goes unnoticed.</p>

  <div id="board"></div>

<script>
  // Equivalent to: useEffect(() => setState({...}))  with no dependency array.
  const board = document.getElementById('board');
  let tick = 0;
  function render() {
    tick += 1;
    board.innerHTML = '';
    for (let i = 0; i < 12; i++) {
      const row = document.createElement('div');
      row.textContent = 'Sourdough loaf - batch ' + tick + '.' + i;
      row.setAttribute('data-tick', String(tick));
      board.appendChild(row);
    }
    requestAnimationFrame(render);
  }
  render();
</script>
</body>
