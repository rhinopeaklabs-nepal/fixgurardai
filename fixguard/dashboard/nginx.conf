# Serves the built dashboard and proxies the API from the same origin.
#
# Same-origin is the point: with /api/ handled here, no browser request is
# ever cross-origin, so CORS stops being something that can be misconfigured
# and the SSE progress stream needs no special treatment to be allowed.

# Coolify's Traefik is the only thing that can reach this container, and it
# appends the real client address to X-Forwarded-For. Without this, every
# request arrives from Traefik's own address, so per-IP limiting would put
# the whole internet in a single bucket and the app would count every
# visitor as the same person.
#
# recursive is off deliberately: that makes nginx take the LAST entry in the
# header, which is the one Traefik appended from the actual peer. A client
# that sends its own X-Forwarded-For only prepends to a list whose last
# entry is still the truth.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive off;

# Starting an audit spends a vCPU on a real Chromium for up to 90 seconds, so
# it is rate limited far more tightly than reading results back. nginx skips a
# limit whose key evaluates empty, which is how one zone can apply to just the
# three endpoints that actually launch work.
map $request_method$uri $fixguard_start_key {
    default                                        "";
    "~^POST/api/v1/audits/start$"                  $binary_remote_addr;
    "~^POST/api/v1/audits$"                        $binary_remote_addr;
    "~^POST/api/v1/audits/[^/]+/retry$"            $binary_remote_addr;
}

limit_req_zone $fixguard_start_key zone=fixguard_start:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=fixguard_api:10m rate=120r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Audit requests are small JSON. A large body here means something is wrong.
    client_max_body_size 2m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location /api/ {
        # burst absorbs the dashboard's own polling; nodelay serves the burst
        # immediately rather than queueing it, which would look like lag.
        limit_req zone=fixguard_api  burst=40 nodelay;
        limit_req zone=fixguard_start burst=3;

        proxy_pass http://api:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        # Set, never forwarded: the value below is the address nginx resolved
        # above, so a caller cannot inflate its own quota by sending it.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The audit streams progress over SSE for up to the 90s hard timeout.
        # With buffering left on, nginx holds every event until the response
        # closes, so the live progress bar sits at zero and then jumps to done.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Vite writes content-hashed filenames here, so these can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html names those hashed files. Caching it pins a browser to the
    # previous bundle after a deploy, which looks exactly like a failed deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side routing: /history and /architecture are React routes, not
    # files on disk, so an unknown path must still return the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
